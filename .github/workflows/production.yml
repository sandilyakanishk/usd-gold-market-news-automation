# Production automation: collects the calendar, looks up released figures and
# SENDS REAL WHATSAPP MESSAGES to the Community's Announcements group, and
# the same messages to the Telegram channel when TELEGRAM_ENABLED is true.
#
# What starts it: an external timer (cron-job.org) calls GitHub's API every
# 10 minutes, day and night, which starts this workflow with mode "auto".
# GitHub's own "schedule" trigger is not used: it never fired for this
# repository.
#
# Every run works out what is due from the India clock (src/runplan.py):
#
#   08:15 - 16:00 India time   daily brief
#   21:15 - 24:00 India time   tomorrow's reminders
#   every run                  collect, enrich, send today's high-impact alerts
#                              and newly released results
#
# The application never sends the same message twice, so a late run simply
# catches up and an extra run does nothing.
#
# To stop the automation: disable the job on cron-job.org, or
# Actions tab -> "Production" -> "..." -> Disable workflow.

name: Production (sends WhatsApp messages)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "auto: decide from India time. Or force one kind of run."
        type: choice
        default: auto
        options:
          - auto
          - polling
          - morning
          - evening

permissions:
  contents: read

# One run of this automation at a time, shared with every other workflow in
# this group. A second run waits; a running job is never cancelled, so a send
# is never interrupted or doubled.
concurrency:
  group: market-news-automation
  cancel-in-progress: false

jobs:
  run:
    name: Collect, enrich and send
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_BACKEND: postgres
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: utf-8

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # Forex Factory refreshes its export about hourly and asks for few
      # downloads. The last download is kept between runs, so the application
      # re-downloads at most every 30 minutes however often this workflow runs.
      - name: Restore the last calendar download
        uses: actions/cache@v4
        with:
          path: data/raw
          key: ff-feed-${{ github.run_id }}
          restore-keys: |
            ff-feed-

      - name: Decide what this run should do
        id: plan
        env:
          REQUESTED: ${{ inputs.mode }}
        run: python -m src.runplan --requested "${REQUESTED:-auto}" | tee -a "$GITHUB_OUTPUT"

      - name: Preflight (reports PRESENT or MISSING, never a value)
        id: preflight
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          WHAPI_TOKEN: ${{ secrets.WHAPI_TOKEN }}
          WHATSAPP_COMMUNITY_ID: ${{ secrets.WHATSAPP_COMMUNITY_ID }}
          WHATSAPP_ANNOUNCEMENT_CHAT_ID: ${{ secrets.WHATSAPP_ANNOUNCEMENT_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.preflight --production

      # Confirms the WhatsApp session and that the destination is still the
      # Community's Announcements group. To stay within Whapi's request
      # allowance it runs once at the start of each window (and whenever a
      # run type is forced by hand), not on every run. Runs started by the
      # external timer arrive as workflow_dispatch and are treated exactly
      # like scheduled runs. A failure here blocks every send.
      - name: WhatsApp destination check (sends nothing)
        id: destination
        if: steps.plan.outputs.check == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WHAPI_TOKEN: ${{ secrets.WHAPI_TOKEN }}
          WHATSAPP_COMMUNITY_ID: ${{ secrets.WHATSAPP_COMMUNITY_ID }}
          WHATSAPP_ANNOUNCEMENT_CHAT_ID: ${{ secrets.WHATSAPP_ANNOUNCEMENT_CHAT_ID }}
        run: python -m src.main --whatsapp-check

      # Downloads the Forex Factory calendar, stores and classifies it, and
      # asks BLS / FRED for figures that have been released.
      - name: Refresh the calendar and look up released figures
        id: collect
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: |
          set +e
          python -m src.main --enrich-actuals --week > collect.out 2> collect.err
          code=$?
          cat collect.out
          cat collect.err >&2
          exit $code

      - name: Send the morning update
        if: ${{ !cancelled() && steps.preflight.outcome == 'success' && steps.destination.outcome != 'failure' && steps.collect.outcome == 'success' && steps.plan.outputs.morning == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WHAPI_TOKEN: ${{ secrets.WHAPI_TOKEN }}
          WHATSAPP_ANNOUNCEMENT_CHAT_ID: ${{ secrets.WHATSAPP_ANNOUNCEMENT_CHAT_ID }}
        run: python -m src.main --whatsapp-send-morning

      - name: Send today's high-impact alerts
        if: ${{ !cancelled() && steps.preflight.outcome == 'success' && steps.destination.outcome != 'failure' && steps.collect.outcome == 'success' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WHAPI_TOKEN: ${{ secrets.WHAPI_TOKEN }}
          WHATSAPP_ANNOUNCEMENT_CHAT_ID: ${{ secrets.WHATSAPP_ANNOUNCEMENT_CHAT_ID }}
        run: python -m src.main --whatsapp-send-alert --today

      # Every run. Covers events from yesterday (India time) onward, so a
      # figure released just before midnight is still picked up afterwards.
      # A message that was already sent is skipped by the application.
      - name: Send newly released results
        if: ${{ !cancelled() && steps.preflight.outcome == 'success' && steps.destination.outcome != 'failure' && steps.collect.outcome == 'success' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WHAPI_TOKEN: ${{ secrets.WHAPI_TOKEN }}
          WHATSAPP_ANNOUNCEMENT_CHAT_ID: ${{ secrets.WHATSAPP_ANNOUNCEMENT_CHAT_ID }}
        run: |
          since="$(python -c "from datetime import datetime, timedelta; from zoneinfo import ZoneInfo; print((datetime.now(ZoneInfo('Asia/Kolkata')) - timedelta(days=1)).date().isoformat())")"
          python -m src.main --whatsapp-send-actuals --from "$since"

      - name: Send tomorrow's reminders
        if: ${{ !cancelled() && steps.preflight.outcome == 'success' && steps.destination.outcome != 'failure' && steps.collect.outcome == 'success' && steps.plan.outputs.evening == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WHAPI_TOKEN: ${{ secrets.WHAPI_TOKEN }}
          WHATSAPP_ANNOUNCEMENT_CHAT_ID: ${{ secrets.WHATSAPP_ANNOUNCEMENT_CHAT_ID }}
        run: python -m src.main --whatsapp-send-upcoming --tomorrow

      # ---- Telegram ----------------------------------------------------------
      # The same messages, unchanged, to the Telegram channel. Switched on by
      # the repository variable TELEGRAM_ENABLED=true; while it is unset these
      # steps are skipped. Telegram keeps its own delivery record, so it is
      # independent of WhatsApp: a problem on one side never blocks the other.
      - name: "Telegram: check the bot and the channel (sends nothing)"
        id: telegram
        if: ${{ !cancelled() && vars.TELEGRAM_ENABLED == 'true' && steps.preflight.outcome == 'success' && steps.collect.outcome == 'success' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.main --telegram-check

      - name: "Telegram: send the morning update"
        if: ${{ !cancelled() && vars.TELEGRAM_ENABLED == 'true' && steps.preflight.outcome == 'success' && steps.collect.outcome == 'success' && steps.telegram.outcome == 'success' && steps.plan.outputs.morning == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.main --telegram-send-morning

      - name: "Telegram: send today's high-impact alerts"
        if: ${{ !cancelled() && vars.TELEGRAM_ENABLED == 'true' && steps.preflight.outcome == 'success' && steps.collect.outcome == 'success' && steps.telegram.outcome == 'success' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.main --telegram-send-alert --today

      - name: "Telegram: send newly released results"
        if: ${{ !cancelled() && vars.TELEGRAM_ENABLED == 'true' && steps.preflight.outcome == 'success' && steps.collect.outcome == 'success' && steps.telegram.outcome == 'success' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          since="$(python -c "from datetime import datetime, timedelta; from zoneinfo import ZoneInfo; print((datetime.now(ZoneInfo('Asia/Kolkata')) - timedelta(days=1)).date().isoformat())")"
          python -m src.main --telegram-send-actuals --from "$since"

      - name: "Telegram: send tomorrow's reminders"
        if: ${{ !cancelled() && vars.TELEGRAM_ENABLED == 'true' && steps.preflight.outcome == 'success' && steps.collect.outcome == 'success' && steps.telegram.outcome == 'success' && steps.plan.outputs.evening == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.main --telegram-send-upcoming --tomorrow

      # The application keeps working from stored data when a source is
      # unavailable. This step makes sure such a run is still reported as
      # failed, so the problem is not missed.
      - name: Fail the run if a source reported a problem
        if: ${{ always() && steps.collect.outcome != 'skipped' }}
        run: |
          problems=0
          if grep -Eq "could not refresh from Forex Factory|Live fetch failed" collect.err 2>/dev/null; then
            echo "::error::The Forex Factory calendar could not be refreshed in this run; stored data was used."
            problems=1
          fi
          if grep -Eq "Release status: .*FAILED [1-9]" collect.out 2>/dev/null; then
            echo "::error::A request to BLS or FRED failed in this run; it will be retried on the next run."
            problems=1
          fi
          if [ "$problems" -eq 0 ]; then echo "No source problem was reported."; fi
          exit $problems
