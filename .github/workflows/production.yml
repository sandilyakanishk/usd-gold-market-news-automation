# Production automation: collects the calendar, looks up released figures and
# SENDS REAL WHATSAPP MESSAGES to the Community's Announcements group.
#
# GitHub cron is in UTC. India time (Asia/Kolkata) is UTC+5:30 all year.
#
#   cron (UTC)            India time                         run type
#   45 2 * * *            08:15                              morning
#   7,37 12-19 * * *      17:37, 18:07, ... 00:37, 01:07     polling (16 runs)
#   45 15 * * *           21:15                              evening
#
# Scheduled runs can start late; GitHub does not guarantee the minute.
#
# To stop the automation: Actions tab -> "Production" -> "..." -> Disable
# workflow, or:  gh workflow disable production.yml

name: Production (sends WhatsApp messages)

on:
  schedule:
    - cron: "45 2 * * *"
    - cron: "7,37 12-19 * * *"
    - cron: "45 15 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Which run to perform (polling: collect, enrich, send new results)"
        type: choice
        default: polling
        options:
          - polling
          - morning
          - evening

permissions:
  contents: read

# One run of this automation at a time, shared with every other workflow in
# this group. A second run waits; a running job is never cancelled, so a send
# is never interrupted or doubled.
concurrency:
  group: market-news-automation
  cancel-in-progress: false

jobs:
  run:
    name: Collect, enrich and send
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_BACKEND: postgres
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: utf-8

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Decide which run this is
        id: mode
        env:
          SCHEDULE: ${{ github.event.schedule }}
          REQUESTED: ${{ inputs.mode }}
        run: |
          case "$SCHEDULE" in
            "45 2 * * *") mode=morning ;;
            "45 15 * * *") mode=evening ;;
            "") mode="${REQUESTED:-polling}" ;;
            *) mode=polling ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Run type: $mode"
          python -c "from datetime import datetime; from zoneinfo import ZoneInfo; print('India time:', datetime.now(ZoneInfo('Asia/Kolkata')).strftime('%A %Y-%m-%d %H:%M'))"

      - name: Preflight (reports PRESENT or MISSING, never a value)
        id: preflight
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          WHAPI_TOKEN: ${{ secrets.WHAPI_TOKEN }}
          WHATSAPP_COMMUNITY_ID: ${{ secrets.WHATSAPP_COMMUNITY_ID }}
          WHATSAPP_ANNOUNCEMENT_CHAT_ID: ${{ secrets.WHATSAPP_ANNOUNCEMENT_CHAT_ID }}
        run: python -m src.preflight --production

      # Confirms the WhatsApp session and that the destination is still the
      # Community's Announcements group. Skipped on polling runs to stay
      # within Whapi's request allowance; a failure here blocks every send.
      - name: WhatsApp destination check (sends nothing)
        id: destination
        if: steps.mode.outputs.mode != 'polling' || github.event_name == 'workflow_dispatch'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WHAPI_TOKEN: ${{ secrets.WHAPI_TOKEN }}
          WHATSAPP_COMMUNITY_ID: ${{ secrets.WHATSAPP_COMMUNITY_ID }}
          WHATSAPP_ANNOUNCEMENT_CHAT_ID: ${{ secrets.WHATSAPP_ANNOUNCEMENT_CHAT_ID }}
        run: python -m src.main --whatsapp-check

      # Downloads the Forex Factory calendar, stores and classifies it, and
      # asks BLS / FRED for figures that have been released.
      - name: Refresh the calendar and look up released figures
        id: collect
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: |
          set +e
          python -m src.main --enrich-actuals --week > collect.out 2> collect.err
          code=$?
          cat collect.out
          cat collect.err >&2
          exit $code

      - name: Send the morning update
        if: ${{ !cancelled() && steps.preflight.outcome == 'success' && steps.destination.outcome != 'failure' && steps.collect.outcome == 'success' && steps.mode.outputs.mode == 'morning' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WHAPI_TOKEN: ${{ secrets.WHAPI_TOKEN }}
          WHATSAPP_ANNOUNCEMENT_CHAT_ID: ${{ secrets.WHATSAPP_ANNOUNCEMENT_CHAT_ID }}
        run: python -m src.main --whatsapp-send-morning

      - name: Send today's high-impact alerts
        if: ${{ !cancelled() && steps.preflight.outcome == 'success' && steps.destination.outcome != 'failure' && steps.collect.outcome == 'success' && steps.mode.outputs.mode == 'morning' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WHAPI_TOKEN: ${{ secrets.WHAPI_TOKEN }}
          WHATSAPP_ANNOUNCEMENT_CHAT_ID: ${{ secrets.WHATSAPP_ANNOUNCEMENT_CHAT_ID }}
        run: python -m src.main --whatsapp-send-alert --today

      # Every run. Covers events from yesterday (India time) onward, so a
      # figure released just before midnight is still picked up afterwards.
      # A message that was already sent is skipped by the application.
      - name: Send newly released results
        if: ${{ !cancelled() && steps.preflight.outcome == 'success' && steps.destination.outcome != 'failure' && steps.collect.outcome == 'success' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WHAPI_TOKEN: ${{ secrets.WHAPI_TOKEN }}
          WHATSAPP_ANNOUNCEMENT_CHAT_ID: ${{ secrets.WHATSAPP_ANNOUNCEMENT_CHAT_ID }}
        run: |
          since="$(python -c "from datetime import datetime, timedelta; from zoneinfo import ZoneInfo; print((datetime.now(ZoneInfo('Asia/Kolkata')) - timedelta(days=1)).date().isoformat())")"
          python -m src.main --whatsapp-send-actuals --from "$since"

      - name: Send tomorrow's reminders
        if: ${{ !cancelled() && steps.preflight.outcome == 'success' && steps.destination.outcome != 'failure' && steps.collect.outcome == 'success' && steps.mode.outputs.mode == 'evening' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WHAPI_TOKEN: ${{ secrets.WHAPI_TOKEN }}
          WHATSAPP_ANNOUNCEMENT_CHAT_ID: ${{ secrets.WHATSAPP_ANNOUNCEMENT_CHAT_ID }}
        run: python -m src.main --whatsapp-send-upcoming --tomorrow

      # The application keeps working from stored data when a source is
      # unavailable. This step makes sure such a run is still reported as
      # failed, so the problem is not missed.
      - name: Fail the run if a source reported a problem
        if: ${{ always() && steps.collect.outcome != 'skipped' }}
        run: |
          problems=0
          if grep -Eq "could not refresh from Forex Factory|Live fetch failed" collect.err 2>/dev/null; then
            echo "::error::The Forex Factory calendar could not be refreshed in this run; stored data was used."
            problems=1
          fi
          if grep -Eq "Release status: .*FAILED [1-9]" collect.out 2>/dev/null; then
            echo "::error::A request to BLS or FRED failed in this run; it will be retried on the next run."
            problems=1
          fi
          if [ "$problems" -eq 0 ]; then echo "No source problem was reported."; fi
          exit $problems
